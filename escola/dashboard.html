<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal SECITEC - Professor</title>
    <link rel="stylesheet" href="dashboard.css">
</head>
<body>
    <div class="dashboard-bg"></div>

    <aside class="sidebar">
        <div class="sidebar-arrow">➔</div>
        <div class="sidebar-content">
            <h2 id="tituloMateria">📚 Professor</h2>
            <ul>
                <li onclick="mostrarSecaoProf('turmas')">🏫 Turmas e Alunos</li>
                <li onclick="logout()" class="btn-logout">🚪 Sair</li>
            </ul>
        </div>
    </aside>

    <main class="main-content">
        
        <!-- Seção 1: Selecionar Turma e Alunos -->
        <section id="secao-turmas" class="card">
            <div class="card-header-decor">🏫 Gestão de Turmas</div>
            <h2>Turmas e Alunos</h2>
            <p class="subtitle">Selecione a turma para gerir notas e faltas dos alunos[cite: 7].</p>

            <div class="input-group">
                <label for="filtroTurma">Filtrar por Turma:</label>
                <select id="filtroTurma" onchange="carregarAlunosPorTurma()">
                    <option value="">Selecione uma turma...</option>
                </select>
            </div>

            <div class="table-container" style="margin-top: 20px;">
                <table>
                    <thead>
                        <tr>
                            <th>Aluno</th>
                            <th>Matrícula</th>
                            <th>Ação</th>
                        </tr>
                    </thead>
                    <tbody id="tabelaAlunosTurma">
                        <tr><td colspan="3" style="text-align: center;">Selecione uma turma acima.</td></tr>
                    </tbody>
                </table>
            </div>
        </section>

        <!-- Seção 2: Lançar / Alterar Notas e Faltas -->
        <section id="secao-notas" class="card hidden">
            <div class="card-header-decor">📝 Notas e Faltas</div>
            <h2>Registo Acadêmico</h2>
            <p class="subtitle" id="subtituloLancamento">Atualize notas e faltas do aluno selecionado.</p>

            <form onsubmit="salvarNotaProfessor(event)">
                <input type="hidden" id="alunoIdNota">
                
                <div class="input-group">
                    <label>Aluno:</label>
                    <input type="text" id="nomeAlunoNota" disabled style="background: #f1f5f9; font-weight: bold;">
                </div>

                <div class="form-row">
                    <div class="input-group">
                        <label for="bimestreProf">Bimestre / Período</label>
                        <select id="bimestreProf">
                            <option value="b1">1º Bimestre</option>
                            <option value="b2">2º Bimestre</option>
                            <option value="b3">3º Bimestre</option>
                            <option value="b4">4º Bimestre</option>
                            <option value="rec">Recuperação</option>
                        </select>
                    </div>
                    <div class="input-group">
                        <label for="notaProf">Nota (0 a 10)</label>
                        <input type="number" id="notaProf" min="0" max="10" step="0.1" placeholder="Nota">
                    </div>
                    <div class="input-group">
                        <label for="faltasProf">Nº de Faltas</label>
                        <input type="number" id="faltasProf" min="0" placeholder="Faltas">
                    </div>
                </div>

                <div style="display: flex; gap: 10px;">
                    <button type="submit" class="btn-salvar" style="flex: 1;">💾 Salvar Alterações</button>
                    <button type="button" class="btn-salvar" onclick="limparDadosAluno()" style="background: #eab308; flex: 1;">🧹 Retirar / Limpar</button>
                </div>
            </form>

            <button type="button" class="btn-voltar" onclick="mostrarSecaoProf('turmas')">⬅ Voltar às Turmas</button>
        </section>

    </main>

    <script src="script.js"></script>
</body>
</html>
